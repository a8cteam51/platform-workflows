name: Secret scan (PR gate)

run-name: Secret scan gate — ${{ github.repository }}#${{ github.event.pull_request.number }}

# PR gate: scans the PR's tree with gitleaks and fails on any unsuppressed finding.
# Suppressions come from the scanned repo's own .gitleaks.toml / .gitleaksignore.
# Secret values are never printed: --redact, and only rule/file:line/fingerprint are surfaced.

on:
  pull_request:

permissions:
  contents: read
  # For the verdict comment on the PR (marker-upserted, best effort). Fork PRs
  # get a read-only token; the comment step degrades to a warning there.
  pull-requests: write

# One in-flight gate per PR; a new push supersedes the previous run.
concurrency:
  group: secret-scan-gate-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GITLEAKS_IMAGE: "ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f"
  # Upsert key for the verdict comment. Single definition on purpose: it is the
  # first body line written by the scan step AND the search key in the comment
  # step; if they drift, every run posts a duplicate comment.
  COMMENT_MARKER: "<!-- secret-scan-gate -->"

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # persist-credentials: false keeps the job token out of .git/config, where gitleaks would flag it.
      - name: Checkout the PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan the checkout (honors .gitleaks.toml / .gitleaksignore)
        run: |
          set -euo pipefail
          RAW="$RUNNER_TEMP/findings.json"
          trap 'rm -f "$RAW"' EXIT   # never leave the (redacted) report lying around

          # Delete .git before scanning — gitleaks `dir` would otherwise scan git
          # internals (and .git/config, which can carry a checkout credential
          # header). Suppressions live in the worktree, not .git, so this is safe.
          rm -rf "$GITHUB_WORKSPACE/.git"

          # `dir .` from INSIDE the repo → the repo's own suppression files
          # resolve (anchored .gitleaks.toml paths, .gitleaksignore fingerprints).
          # --exit-code 1: a finding is a failure — this is a gate, not an audit.
          set +e
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/repo:ro" -v "$RUNNER_TEMP:/out" -w /repo \
            "$GITLEAKS_IMAGE" dir . \
            --report-format json --report-path /out/findings.json \
            --redact --no-banner --exit-code 1
          rc=$?
          set -e

          if [ "$rc" -eq 0 ]; then
            echo "::notice::No secrets found — gate passes."
            echo "clean" > "$RUNNER_TEMP/scan-outcome"
            exit 0
          fi

          if [ "$rc" -ne 1 ]; then
            # Not a "leaks found" (1) — gitleaks itself errored. Fail closed: a
            # gate must not pass a PR it couldn't actually scan.
            echo "::error::gitleaks failed to run (exit $rc) — failing the gate (fail-closed)."
            exit 1
          fi

          # rc == 1: unsuppressed findings. Surface rule/file:line/fingerprint
          # (values are redacted; the fingerprint is file:rule:line, no secret
          # material) as annotations + a job summary, then block the merge.
          COUNT=$(jq 'length' "$RAW" 2>/dev/null || echo '?')
          echo "::error::Secret scan found ${COUNT} potential secret(s). Rotate and remove a real secret. Suppress a confirmed false positive with gitleaks:allow at the end of the line, its fingerprint in .gitleaksignore, or a .gitleaks.toml allowlist."
          # File/RuleID/Fingerprint come from the scanned tree (paths, and rule
          # ids when the repo defines custom rules), so they are PR-author
          # controlled: strip newlines so a crafted name cannot break out of the
          # annotation line and forge workflow commands.
          jq -r 'def s: tostring | gsub("[\r\n]"; " "); .[]? | "::error file=\(.File|s),line=\(.StartLine)::[\(.RuleID|s)] potential secret (value redacted). Fingerprint: \(.Fingerprint|s)"' "$RAW" 2>/dev/null || true
          # One findings report, used twice: job summary now, PR comment in the
          # next step (first line is the upsert marker, stripped for the summary).
          # Same fields neutralized harder here: `|` breaks the table, and in a
          # PR comment backticks/@ give an attacker formatting and notification
          # pings under the bot's identity.
          {
            echo "$COMMENT_MARKER"
            echo "## Secret scan: ${COUNT} finding(s), merge blocked"
            echo ""
            echo "Rotate and remove a real secret. Suppress a confirmed false positive with \`gitleaks:allow\` at the end of the line, its fingerprint in \`.gitleaksignore\`, or a path allowlist in \`.gitleaks.toml\`."
            echo ""
            echo "| Rule | File | Line | Fingerprint |"
            echo "|---|---|---|---|"
            jq -r 'def s: tostring | gsub("[\r\n|`@]"; "?"); .[]? | "| \(.RuleID|s) | \(.File|s) | \(.StartLine) | \(.Fingerprint|s) |"' "$RAW" 2>/dev/null || true
          } > "$RUNNER_TEMP/pr-comment.md"
          tail -n +2 "$RUNNER_TEMP/pr-comment.md" >> "$GITHUB_STEP_SUMMARY"
          echo "findings" > "$RUNNER_TEMP/scan-outcome"
          exit 1

      # Mirror the verdict as a PR comment so it is visible without opening the
      # checks tab. Marker-upserted: one comment per PR, edited in place; a PR
      # that goes clean gets the same comment flipped to an all-clear (never a
      # fresh comment on an always-clean PR). Best effort by design: a comment
      # failure warns but never changes the gate verdict.
      - name: Post the verdict as a PR comment (best effort)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          OUTCOME=$(cat "$RUNNER_TEMP/scan-outcome" 2>/dev/null || true)
          if [ -z "$OUTCOME" ]; then
            # Scan never reached a verdict (setup failure / gitleaks error) —
            # nothing trustworthy to say on the PR.
            exit 0
          fi
          API="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          AUTH="Authorization: Bearer $GH_TOKEN"
          JSON="Content-Type: application/json"

          # Find our comment: bot-authored AND marker-prefixed. The author
          # guard stops a PR author from capturing the upsert by pre-seeding a
          # comment that starts with the marker. Paged so a chatty PR cannot
          # hide the comment past the first 100 and cause duplicates.
          CID=""
          page=1
          while [ "$page" -le 10 ]; do
            RESP=$(curl -sf -H "$AUTH" "$API/issues/$PR_NUMBER/comments?per_page=100&page=$page") || break
            CID=$(printf '%s' "$RESP" | jq -r --arg m "$COMMENT_MARKER" \
              '[.[] | select((.user.type // "") == "Bot") | select((.body // "") | startswith($m))][0].id // empty' 2>/dev/null) || CID=""
            if [ -n "$CID" ]; then
              break
            fi
            N=$(printf '%s' "$RESP" | jq 'length' 2>/dev/null) || N=0
            if [ "$N" -lt 100 ]; then
              break
            fi
            page=$((page + 1))
          done

          if [ "$OUTCOME" = "clean" ]; then
            if [ -z "$CID" ]; then
              # An always-clean PR never gets a comment.
              exit 0
            fi
            BODY=$(printf '%s\n## Secret scan: clean\n\nAll previously reported findings are removed or suppressed. The gate passes.' "$COMMENT_MARKER")
          else
            BODY=$(cat "$RUNNER_TEMP/pr-comment.md")
          fi
          PAYLOAD=$(jq -n --arg b "$BODY" '{body: $b}')

          posted=""
          if [ -n "$CID" ]; then
            curl -sf -X PATCH -H "$AUTH" -H "$JSON" \
              -d "$PAYLOAD" "$API/issues/comments/$CID" > /dev/null && posted=1 || true
          fi
          if [ -z "$posted" ]; then
            # No comment yet, or the PATCH failed (comment deleted mid-run):
            # fall back to a fresh POST so the verdict is never suppressed.
            curl -sf -X POST -H "$AUTH" -H "$JSON" \
              -d "$PAYLOAD" "$API/issues/$PR_NUMBER/comments" > /dev/null \
              || echo "::warning::Could not post the gate comment on PR #$PR_NUMBER (read-only token on fork PRs is expected)."
          fi
          rm -f "$RUNNER_TEMP/pr-comment.md" "$RUNNER_TEMP/scan-outcome"
